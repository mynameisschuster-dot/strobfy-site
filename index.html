<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STROBFY — Stills are Dead</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="Strobfy turns your photos into flickering, high-contrast strobe video for Stories, Reels and posts. Free on the App Store for iPhone. Nothing leaves your device.">
<meta name="apple-itunes-app" content="app-id=6813027970">
<meta property="og:title" content="STROBFY — Stills are Dead">
<meta property="og:description" content="We don't edit photos. We break them. Free on iPhone.">
<meta property="og:url" content="https://strobfy.com/">
<meta property="og:image" content="https://strobfy.com/assets/loops/default/poster-landscape.jpg">
<meta name="theme-color" content="#000000">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#fff}
  body{font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  a{color:inherit}

  .hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;align-items:center}
  .bg,.bg video,.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .bg{z-index:0;background:#000}
  .shade{position:absolute;inset:0;z-index:1;background:rgba(0,0,0,.6)}

  .brand{position:relative;z-index:2;margin-top:calc(28px + env(safe-area-inset-top));
    display:inline-flex;align-items:center;gap:7px;font-size:16px;font-weight:700;letter-spacing:0;color:#fff;text-decoration:none}
  .brand i{width:6px;height:6px;border-radius:999px;background:#fff;animation:blink .2s steps(1,end) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}

  .center{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px 24px 72px;width:100%}
  h1{margin:0;font-weight:400;line-height:1;letter-spacing:-.02em;font-size:clamp(56px,12.5vw,200px);
    text-shadow:0 2px 30px rgba(0,0,0,.35);white-space:nowrap}
  .sub{margin:clamp(14px,2.2vw,26px) 0 0;font-size:clamp(17px,1.9vw,24px);line-height:1.35;text-shadow:0 1px 12px rgba(0,0,0,.5)}
  .cta{display:inline-block;margin-top:clamp(28px,4vw,44px);border-radius:16px;line-height:0;
    transition:transform .15s ease,opacity .15s ease}
  .cta img{width:clamp(168px,15vw,200px);height:auto;display:block}
  .cta:hover{transform:translateY(-1px);opacity:.9}
  .cta:focus-visible{outline:2px solid #fff;outline-offset:5px}
  .note{margin:14px 0 0;font-size:13px;color:rgba(255,255,255,.72)}

  .foot{position:absolute;z-index:2;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;
    gap:6px 20px;padding:16px 64px calc(16px + env(safe-area-inset-bottom)) 32px;font-size:13px;color:rgba(255,255,255,.7)}
  .foot a{color:rgba(255,255,255,.7);text-underline-offset:3px}
  .foot a:hover{color:#fff}
  .toggle{position:absolute;z-index:3;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));width:36px;height:36px;border-radius:999px;
    border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
  .toggle:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .toggle svg{width:12px;height:12px;fill:currentColor}

  @media (max-width:640px){
    h1{white-space:normal;font-size:clamp(64px,24vw,120px);line-height:.98}
    h1 span{display:block}
    .foot{padding-left:20px}
  }
  @media (prefers-reduced-motion:reduce){.brand i{animation:none}}
</style>
</head>
<body>
<main class="hero">
  <div class="bg" aria-hidden="true">
    <video id="loop" autoplay muted loop playsinline webkit-playsinline disablepictureinpicture disableremoteplayback preload="auto"></video>
  </div>
  <div class="shade" aria-hidden="true"></div>

  <a class="brand" href="/" aria-label="STROBFY home">STROBFY<i aria-hidden="true"></i></a>

  <div class="center">
    <h1><span>Stills</span> <span>are</span> <span>Dead.</span></h1>
    <p class="sub">We don't edit photos. We break them.</p>
    <a class="cta" href="https://apps.apple.com/app/strobfy-strobe-video/id6813027970" target="_blank" rel="noopener">
      <img src="assets/app-store-badge.svg" alt="Download on the App Store" width="496" height="172">
    </a>
    <p class="note">Free for iPhone</p>
  </div>

  <nav class="foot" aria-label="Footer">
    <a href="https://instagram.com/strobfy" target="_blank" rel="noopener">Instagram</a>
    <a href="/privacy.html">Privacy</a>
    <a href="/terms.html">Terms</a>
    <a href="mailto:support@strobfy.com">support@strobfy.com</a>
    <span>© 2026 STROBFY</span>
  </nav>

  <button class="toggle" id="toggle" type="button" aria-label="Pause background video" aria-pressed="false">
    <svg id="icoPause" viewBox="0 0 12 12"><rect x="1.5" y="1" width="3" height="10"/><rect x="7.5" y="1" width="3" height="10"/></svg>
    <svg id="icoPlay" viewBox="0 0 12 12" style="display:none"><path d="M2.5 1v10l8.5-5z"/></svg>
  </button>
</main>

<script>
(function(){
  var v=document.getElementById('loop'), btn=document.getElementById('toggle');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Bei jedem Besuch zufaellig einer der Loops aus assets/loops/loops.json
  // (der Reel-Bot traegt dort regelmaessig neue ein). Ohne Liste: "default".
  var loopId='default';
  function choose(list){
    if(!list||!list.length) return 'default';
    var last=null; try{ last=localStorage.getItem('strobfy.lastLoop'); }catch(e){}
    var pool=list.length>1?list.filter(function(x){return x!==last;}):list;
    var id=pool[Math.floor(Math.random()*pool.length)];
    try{ localStorage.setItem('strobfy.lastLoop',id); }catch(e){}
    return id;
  }
  // iOS Safari spielt nur stumm + inline automatisch ab. Die Eigenschaften
  // muessen per JS gesetzt sein, bevor src zugewiesen wird.
  v.muted=true; v.defaultMuted=true; v.playsInline=true;
  v.setAttribute('muted',''); v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
  function wantPlay(){ return !reduce && btn.getAttribute('aria-pressed')!=='true'; }
  function tryPlay(){
    if(!wantPlay()) return;
    var p=v.play(); if(p&&p.catch) p.catch(function(){});
  }
  v.addEventListener('loadeddata',tryPlay);
  v.addEventListener('canplay',tryPlay);
  // Rueckfall (z. B. Stromsparmodus): beim ersten Antippen/Scrollen starten
  ['touchstart','pointerdown','scroll','keydown'].forEach(function(ev){
    window.addEventListener(ev,function once(){ tryPlay(); window.removeEventListener(ev,once); },{passive:true});
  });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) tryPlay(); });
  function pick(){
    var name=window.innerHeight>window.innerWidth?'portrait':'landscape';
    var key=loopId+'/'+name;
    if(v.dataset.cur===key) return;
    v.dataset.cur=key;
    var base='assets/loops/'+loopId+'/';
    v.poster=base+'poster-'+name+'.jpg';
    v.src=base+name+'.mp4';
    v.load();
    tryPlay();
  }
  function setPaused(paused){
    btn.setAttribute('aria-pressed',paused?'true':'false');
    btn.setAttribute('aria-label',paused?'Play background video':'Pause background video');
    document.getElementById('icoPause').style.display=paused?'none':'';
    document.getElementById('icoPlay').style.display=paused?'':'none';
    if(paused) v.pause(); else { var p=v.play(); if(p&&p.catch) p.catch(function(){}); }
  }
  btn.addEventListener('click',function(){ setPaused(btn.getAttribute('aria-pressed')!=='true'); });
  var t; window.addEventListener('resize',function(){ clearTimeout(t); t=setTimeout(pick,200); });
  if(reduce) setPaused(true);
  var started=false;
  function start(list){ if(started) return; started=true; loopId=choose(list); pick(); }
  try{
    fetch('assets/loops/loops.json',{cache:'no-store'})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(d){ start(d&&d.loops); })
      .catch(function(){ start(null); });
  }catch(e){ start(null); }
  setTimeout(function(){ start(null); },2500);
})();
</script>
</body>
</html>
